[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "inventory-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "websockets>=12.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",

    # Vector DB
    "qdrant-client>=1.9.0",

    # Embeddings (local, no API cost)
    "sentence-transformers>=3.0.0",

    # LLM clients (ADR-001: Gemini 1.5 Flash — voz + NER + explicaciones NL)
    "google-genai>=1.0.0",

    # Auth
    "pyjwt>=2.8.0",
    "passlib[bcrypt]>=1.7.4",

    # Validation & config
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",

    # Fuzzy matching fallback for catalog
    "rapidfuzz>=3.9.0",

    # Export
    "openpyxl>=3.1.0",

    # Utilities
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "faker>=25.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
