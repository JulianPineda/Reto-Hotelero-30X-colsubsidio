server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: React Router owns /select, /count, /supervisor client-side.
    # Without this, a direct nav or page refresh on any of those routes 404s
    # at nginx before React ever loads.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
